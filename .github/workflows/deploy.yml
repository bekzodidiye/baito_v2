name: 🚀 Deploy to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: 🔄 Auto Deploy on Server
    runs-on: self-hosted
    steps:
      - name: 📥 Sync repository and start containers
        run: |
          mkdir -p /home/scarygun/IntellexGroup
          cd /home/scarygun/IntellexGroup

          if [ ! -d "/home/scarygun/IntellexGroup/Baito/.git" ]; then
            echo "📦 First time setup: Cloning repository via SSH..."
            git clone git@github.com:bekzodidiye/baito-v3-.git Baito
          fi

          cd /home/scarygun/IntellexGroup/Baito
          echo "📥 Pulling latest code..."
          git fetch origin main
          git reset --hard origin/main

          echo "🐳 Starting Docker containers..."
          docker compose up -d --build --remove-orphans

          echo "✅ Deployed successfully!"
