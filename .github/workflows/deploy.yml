name: 🚀 Deploy to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: 🔄 Auto Deploy on Server
    runs-on: self-hosted
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Deploy Docker containers
        run: |
          echo "📁 Syncing repository files..."
          mkdir -p /home/scarygun/IntellexGroup/Baito
          rsync -av --delete \
            --exclude '.env' \
            --exclude 'backend/.env' \
            --exclude 'postgres_data' \
            --exclude 'redis_data' \
            --exclude 'minio_data' \
            ./ /home/scarygun/IntellexGroup/Baito/
          
          echo "🚀 Rebuilding and starting containers..."
          cd /home/scarygun/IntellexGroup/Baito
          docker compose up -d --build --remove-orphans
          
          echo "✅ Deployed successfully!"
