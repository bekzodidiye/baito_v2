
name: 🚀 Baito CI/CD & Deployment Pipeline

on:
  workflow_dispatch: # Avtomatik triggerlar o'chirilgan (faqat qo'lda kerak bo'lsa)

jobs:
  # ==========================================================
  # 1. BACKEND QUALITY & SMOKE TEST
  # ==========================================================
  test-backend:
    name: 🐍 1. Backend Test & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Verify Backend Routes, Models & DB Initialization
        working-directory: ./backend
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: test_secret_key_32_characters_long_ci_cd_12345
          ENVIRONMENT: test
        run: |
          python -c "from app.main import app; print('✅ Backend integrity verified. App Title:', app.title)"

  # ==========================================================
  # 2. FRONTEND TYPECHECK & PRODUCTION BUILD
  # ==========================================================
  test-frontend:
    name: 🎨 2. Frontend Build & Bundle Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Production Artifacts
        working-directory: ./frontend
        run: npm run build

  # ==========================================================
  # 3. DOCKER ARCHITECTURE VALIDATION
  # ==========================================================
  validate-docker:
    name: 🐳 3. Docker Compose Architecture Validation
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          touch backend/.env
          docker compose config

  # ==========================================================
  # 4. SECURE PRODUCTION DEPLOYMENT (STRICTLY AFTER TESTS PASS)
  # ==========================================================
  deploy:
    name: 🚀 4. Production Auto-Deploy (Server)
    needs: [test-backend, test-frontend, validate-docker]
    if: false # Avtomatik serverga deploy butunlay uzib qo'yildi
    runs-on: self-hosted
    steps:
      - name: 📥 Checkout Code on Server
        uses: actions/checkout@v4

      - name: 🔄 Sync Workspace & Deploy Containers
        run: |
          echo "📁 Syncing repository files from $GITHUB_WORKSPACE..."
          mkdir -p /home/scarygun/IntellexGroup/Baito
          rsync -av --delete \
            --exclude '.env' \
            --exclude 'backend/.env' \
            --exclude 'postgres_data' \
            --exclude 'redis_data' \
            --exclude 'minio_data' \
            --exclude 'backups' \
            --exclude 'backups/*' \
            --exclude 'baito_local_backups' \
            "$GITHUB_WORKSPACE/" /home/scarygun/IntellexGroup/Baito/
          
          echo "🚀 Rebuilding and starting live containers..."
          cd /home/scarygun/IntellexGroup/Baito
          docker compose -f docker-compose.yml up -d --build --remove-orphans
          
          echo "✅ Production deployment completed successfully!"
